name: Analyze Editing References

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp pillow

      - name: Download and inspect reference Shorts
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python analyze_references.py

      - name: Upload reference review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Editing-References
          path: reference_review/
          if-no-files-found: warn
          retention-days: 3
