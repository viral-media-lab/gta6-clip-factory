name: Audio Engine Prototype

on:
  workflow_dispatch:

jobs:
  audio-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render short audio prototype
        run: python audio_engine.py --test
      - name: Upload audio test and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Audio-Test
          path: output/audio_test/
          if-no-files-found: error
          retention-days: 7
