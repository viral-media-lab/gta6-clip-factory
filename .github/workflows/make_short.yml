
name: Generate GTA 6 Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install --upgrade edge-tts pillow numpy gTTS

      - name: Generate video
        run: python make_short.py

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Short
          path: output/gta6_short.mp4
          retention-days: 7
