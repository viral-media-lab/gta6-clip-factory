name: Generate GTA 6 Short

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find absurd meme and reaction clips
        run: python meme_finder.py

      - name: Generate video
        run: python make_short.py

      - name: Upload finished MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Short
          path: output/gta6_short.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Upload media source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Media-Sources
          path: assets/bodycam/sources.json
          if-no-files-found: ignore
          retention-days: 30
