name: Generate GTA 6 Short

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/make_short.yml'
      - '.github/workflows/audio_test.yml'
      - 'audio_engine.py'
      - 'AUDIO_ENGINE.md'
      - 'media_finder.py'
      - 'bodycam_finder.py'

concurrency:
  group: gta6-short-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Generate video
        run: python make_short.py

      - name: Upload finished MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Short
          path: output/gta6_short.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Upload media source manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Media-Sources
          path: assets/bodycam/sources.json
          if-no-files-found: ignore
          retention-days: 30
