name: Shorts asset preflight

on:
  push:
    branches:
      - fix/single-voice-fail-fast
    paths:
      - "make_short.py"
      - "meme_finder.py"
      - "meme_preflight.py"
      - "requirements.txt"
      - "voice_preflight.py"
      - ".github/workflows/shorts_preflight.yml"

concurrency:
  group: gta6-short-preflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  asset-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install preflight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts numpy Pillow requests yt-dlp
      - name: Check Python syntax
        run: python -m py_compile make_short.py meme_finder.py voice_preflight.py meme_preflight.py
      - name: Generate narration only
        run: python voice_preflight.py
      - name: Discover and inspect relevant meme candidates
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python meme_preflight.py
      - name: Upload preflight artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Asset-Preflight
          path: |
            output/voice.mp3
            output/audio_audit.json
            output/audio/*.wav
            output/meme_contact_sheet.jpg
            assets/memes/sources.json
            assets/memes/*.webm
            assets/memes/*.ogv
            assets/memes/*.mp4
          if-no-files-found: warn
          retention-days: 7
