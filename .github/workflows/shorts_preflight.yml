name: Shorts voice preflight

on:
  push:
    branches:
      - fix/single-voice-fail-fast
    paths:
      - "make_short.py"
      - "meme_finder.py"
      - "requirements.txt"
      - "voice_preflight.py"
      - ".github/workflows/shorts_preflight.yml"

permissions:
  contents: read

jobs:
  voice-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install voice dependencies
        run: |
          python -m pip install --upgrade pip
          pip install piper-tts numpy Pillow
      - name: Check Python syntax
        run: python -m py_compile make_short.py meme_finder.py voice_preflight.py
      - name: Generate narration only
        run: python voice_preflight.py
      - name: Upload voice preflight artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GTA6-Voice-Preflight
          path: |
            output/voice.mp3
            output/audio_audit.json
            output/audio/*.mp3
          if-no-files-found: warn
          retention-days: 7
